<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netdx</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('netdx-theme');
    if(t === 'light' || t === 'dark'){ document.documentElement.dataset.theme = t; }
  }catch(e){}
})();
</script>
<style>
  :root{
    --ok:#009E73;
    --warn:#E69F00;
    --bad:#D55E00;
    --info:#0072B2;
    --accent2:#56B4E9;
    --accent3:#CC79A7;
    --fg:#1a1a1a;
    --bg:#f5f5f5;
    --card-bg:#ffffff;
    --border:#dcdcdc;
    --muted:#666666;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --fg:#f0f0f0;
      --bg:#121212;
      --card-bg:#1c1c1c;
      --border:#333333;
      --muted:#a0a0a0;
    }
  }
  :root[data-theme="dark"]{
    --fg:#f0f0f0;
    --bg:#121212;
    --card-bg:#1c1c1c;
    --border:#333333;
    --muted:#a0a0a0;
  }
  :root[data-theme="light"]{
    --fg:#1a1a1a;
    --bg:#f5f5f5;
    --card-bg:#ffffff;
    --border:#dcdcdc;
    --muted:#666666;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;}
  [hidden]{display:none !important;}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:.5rem;flex-wrap:wrap;
    padding:.7rem 1rem;
    border-bottom:1px solid var(--border);
    background:var(--card-bg);
    position:sticky;top:0;z-index:10;
  }
  header h1{font-size:1.05rem;margin:0;letter-spacing:.03em;}
  .header-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}

  .pill{
    display:inline-flex;align-items:center;gap:.4rem;
    padding:.3rem .7rem;border-radius:999px;
    font-size:.78rem;font-weight:700;
    border:1px solid var(--border);
    background:var(--bg);white-space:nowrap;
  }
  .pill .dot{width:.55rem;height:.55rem;border-radius:50%;flex:0 0 auto;background:currentColor;}
  .pill.ok{color:var(--ok);border-color:var(--ok);}
  .pill.warn{color:var(--warn);border-color:var(--warn);}
  .pill.bad{color:var(--bad);border-color:var(--bad);}
  .pill.info{color:var(--info);border-color:var(--info);}
  .pill.info .dot{animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .theme-toggle-btn{
    display:inline-flex;align-items:center;gap:.35rem;
    min-height:40px;padding:.35rem .7rem;
    border-radius:999px;border:1px solid var(--border);
    background:var(--bg);color:var(--fg);
    font-size:.78rem;font-weight:700;cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .theme-toggle-btn:hover{border-color:var(--info);color:var(--info);}
  .theme-toggle-btn .theme-glyph{font-size:.95rem;line-height:1;}
  .update-banner{
    display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
    padding:.55rem 1rem;
    border-bottom:1px solid var(--border);
    background:var(--card-bg);
    font-size:.85rem;
  }
  .update-banner-text{flex:1 1 auto;min-width:0;font-weight:700;}
  .update-banner-text.error-text{margin:0;}
  .update-banner-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
  .update-banner.available{color:var(--info);}
  .update-banner.uptodate{color:var(--ok);}
  .update-banner.installing{color:var(--warn);}

  nav.tabs{
    display:flex;overflow-x:auto;
    border-bottom:1px solid var(--border);
    background:var(--card-bg);
  }
  nav.tabs button{
    flex:1 0 auto;min-width:88px;min-height:44px;
    padding:.7rem .5rem;
    background:none;border:none;
    color:var(--muted);
    font-size:.82rem;font-weight:700;letter-spacing:.01em;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button.active{color:var(--info);border-bottom-color:var(--info);}
  nav.tabs button:hover{color:var(--fg);}

  main{flex:1;padding:1rem;max-width:1100px;width:100%;margin:0 auto;}
  section.tabpanel{display:none;}
  section.tabpanel.active{display:block;animation:fadein .15s ease;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}

  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:1rem;
    margin-bottom:1rem;
  }
  .card.default{border-color:var(--info);box-shadow:0 0 0 1px var(--info) inset;}
  .grid-ifaces{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;}

  .iface-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;flex-wrap:wrap;}
  .iface-title{display:flex;flex-direction:column;}
  .iface-name{font-weight:700;font-size:1rem;}
  .iface-friendly{color:var(--muted);font-size:.8rem;}
  .iface-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;}
  .tag{font-size:.65rem;font-weight:700;padding:.18rem .45rem;border-radius:5px;letter-spacing:.03em;}
  .tag-default{color:var(--info);border:1px solid var(--info);background:rgba(0,114,178,.1);}
  .tag-loop{color:var(--muted);border:1px solid var(--border);}

  .badge{
    display:inline-flex;align-items:center;gap:.3rem;
    padding:.2rem .55rem;border-radius:6px;
    font-size:.72rem;font-weight:700;letter-spacing:.03em;
    border:1px solid currentColor;flex:0 0 auto;
  }
  .badge.up{color:var(--ok);}
  .badge.down{color:var(--bad);}
  .badge .glyph{font-weight:900;font-size:.7rem;}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem .75rem;font-size:.83rem;margin:.6rem 0 0;}
  .kv dt{color:var(--muted);}
  .kv dd{margin:0;word-break:break-all;}

  .controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin-bottom:1rem;}
  .field{display:flex;flex-direction:column;gap:.25rem;font-size:.78rem;color:var(--muted);}
  .status-line{display:flex;gap:1.2rem;flex-wrap:wrap;margin-bottom:.6rem;font-size:.88rem;}

  input[type=text],input[type=number],select{
    min-height:42px;padding:.4rem .6rem;
    border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--fg);font-size:16px;
    min-width:0;
  }
  input:disabled,select:disabled{opacity:.55;}

  button.btn{
    min-height:42px;padding:.5rem 1.15rem;border-radius:8px;
    border:1px solid var(--info);background:var(--info);color:#fff;
    font-weight:700;font-size:.85rem;cursor:pointer;
    transition:opacity .15s ease;
  }
  button.btn.secondary{background:none;color:var(--info);}
  button.btn.danger{background:var(--bad);border-color:var(--bad);}
  button.btn.danger.secondary{background:none;color:var(--bad);}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}
  button.btn:not(:disabled):active{opacity:.8;}
  button.btn.update-ready{background:var(--info);color:#fff;box-shadow:0 0 0 3px rgba(0,114,178,.25);}
  button.btn.secondary.update-ready{background:rgba(0,114,178,.1);}
  .update-dot{
    display:inline-block;width:.5rem;height:.5rem;margin-left:.4rem;
    border-radius:50%;background:var(--info);vertical-align:middle;
    animation:pulse 1.1s ease-in-out infinite;
  }

  .error-text{color:var(--bad);font-weight:700;font-size:.85rem;margin:.25rem 0 .8rem;}

  table.hops{width:100%;border-collapse:collapse;font-size:.85rem;}
  table.hops th{text-align:left;padding:.4rem .5rem;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
  table.hops td{padding:.45rem .5rem;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.hops tr.hop-timeout td{color:var(--bad);}
  .rtt-meter{display:flex;align-items:center;gap:.5rem;min-width:140px;}
  .rtt-meter .rtt-val{flex:0 0 auto;width:4.5em;}
  .rtt-meter .bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .rtt-meter .bar-fill{height:100%;width:0;background:var(--info);transition:width .2s ease;}

  .terminal{
    background:#0b0b0b;color:#d7d7d7;
    border-radius:8px;padding:.75rem;
    height:min(50vh,420px);overflow-y:auto;
    white-space:pre-wrap;word-break:break-all;
    font-size:.8rem;line-height:1.35;
  }
  .terminal-input-row{display:flex;gap:.5rem;margin-top:.6rem;}
  .terminal-input-row input{flex:1;}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;margin-top:1rem;}
  .stat{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:.7rem;text-align:center;}
  .stat .label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .stat .value{font-size:1.3rem;font-weight:700;margin-top:.2rem;}
  .stat .value.muted-stat{font-size:.82rem;font-weight:600;color:var(--muted);}
  .speed-readout{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:.75rem;}
  .speed-metric{flex:1 1 160px;}
  .speed-metric-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .speed-metric-status{text-transform:none;letter-spacing:0;font-weight:700;}
  .speed-metric-value{font-size:2.1rem;font-weight:800;line-height:1.15;margin-top:.15rem;}
  .dl-color{color:var(--info);}
  .ul-color{color:var(--accent3);}
  .speed-metric-value.muted-stat{font-size:.95rem;font-weight:600;color:var(--muted);}
  #spark{width:100%;height:160px;display:block;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;}

  .log-panel-wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 1rem;}
  .log-panel-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem;font-weight:700;font-size:.83rem;}
  .log-panel-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
  .log-panel-body{max-height:280px;overflow-y:auto;border-top:1px solid var(--border);}
  .log-row{display:flex;gap:.6rem;padding:.32rem .1rem;font-size:.76rem;border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-row .log-time{color:var(--muted);flex:0 0 auto;}
  .log-row .log-msg{word-break:break-word;}
  .log-row .log-msg a.export-link{color:var(--info);text-decoration:underline;font-weight:700;}
  .log-row .log-msg a.export-link:hover{color:var(--accent2);}
  footer.site-footer{
    text-align:center;
    padding:1rem 1rem 5rem;
    font-size:.78rem;
    color:var(--muted);
  }
  footer.site-footer a{
    color:var(--muted);
    text-decoration:underline;
    transition:color .15s ease;
  }
  footer.site-footer a:hover{color:var(--info);}

  @media (max-width:520px){
    header h1{font-size:.95rem;}
    nav.tabs button{font-size:.76rem;min-width:70px;}
    .status-line{gap:.7rem;}
  }
</style>
</head>
<body>

<header>
  <h1>netdx</h1>
  <div class="header-right">
    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Toggle colour theme">
      <span class="theme-glyph" aria-hidden="true"></span><span class="theme-label"></span>
    </button>
    <button id="checkUpdateBtn" class="btn secondary" type="button"><span id="checkUpdateBtnText">Check for Updates</span><span id="checkUpdateDot" class="update-dot" hidden aria-hidden="true"></span></button>
    <div id="statusPill" class="pill info" role="status" aria-live="polite">
      <span class="dot"></span><span id="statusText">Connecting…</span>
    </div>
  </div>
</header>
<div id="updateBanner" class="update-banner" role="status" aria-live="polite" hidden>
  <span id="updateBannerText" class="update-banner-text"></span>
  <div class="update-banner-actions">
    <button id="updateInstallBtn" class="btn" type="button" hidden>Install &amp; Restart</button>
    <button id="updateDismissBtn" class="btn secondary" type="button" hidden>Dismiss</button>
  </div>
</div>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="overview" role="tab" aria-selected="true" type="button">Overview</button>
  <button class="tab-btn" data-tab="traceroute" role="tab" aria-selected="false" type="button">Traceroute</button>
  <button class="tab-btn" data-tab="telnet" role="tab" aria-selected="false" type="button">Telnet</button>
  <button class="tab-btn" data-tab="speedtest" role="tab" aria-selected="false" type="button">Speed Test</button>
</nav>

<main>

  <section id="tab-overview" class="tabpanel active" role="tabpanel">
    <div class="controls">
      <div><strong>Default interface:</strong> <span id="defaultIfaceName" class="mono">—</span></div>
      <div><strong>Public IP:</strong> <span id="publicIp" class="mono">—</span></div>
      <button class="btn secondary" id="refreshIfacesBtn" type="button">Refresh</button>
    </div>
    <div id="ifaceGrid" class="grid-ifaces"></div>
  </section>

  <section id="tab-traceroute" class="tabpanel" role="tabpanel">
    <div class="controls">
      <div class="field">
        <label for="trTarget">Target</label>
        <input type="text" id="trTarget" class="mono" placeholder="8.8.8.8 or example.com" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field" style="max-width:100px;">
        <label for="trMaxHops">Max hops</label>
        <input type="number" id="trMaxHops" min="1" max="64" value="30">
      </div>
      <button class="btn" id="trStartBtn" type="button">Start</button>
      <button class="btn danger secondary" id="trStopBtn" type="button" disabled>Stop</button>
    </div>
    <div class="status-line">
      <span><strong>Status:</strong> <span id="trStatusText" class="mono">Idle</span></span>
      <span><strong>Resolved:</strong> <span id="trResolved" class="mono">—</span></span>
    </div>
    <p id="trError" class="error-text" hidden></p>
    <div class="card" style="overflow-x:auto;">
      <table class="hops">
      <thead><tr><th>TTL</th><th>Address</th><th>Hostname</th><th>Location</th><th>RTT</th></tr></thead>
        <tbody id="hopsBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-telnet" class="tabpanel" role="tabpanel">
    <div class="controls">
      <div class="field">
        <label for="tnHost">Host</label>
        <input type="text" id="tnHost" class="mono" placeholder="192.168.1.1" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field" style="max-width:100px;">
        <label for="tnPort">Port</label>
        <input type="number" id="tnPort" min="1" max="65535" value="23">
      </div>
      <button class="btn" id="tnConnectBtn" type="button">Connect</button>
      <button class="btn danger secondary" id="tnDisconnectBtn" type="button" disabled>Disconnect</button>
      <span id="tnStatusPill" class="pill bad">
        <span class="dot"></span><span id="tnStatusText">Disconnected</span>
      </span>
    </div>
    <p id="tnError" class="error-text" hidden></p>
    <div id="tnTerminal" class="terminal mono" aria-live="polite"></div>
    <div class="terminal-input-row">
      <input type="text" id="tnInput" class="mono" placeholder="Type and press Enter to send" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
    </div>
  </section>

  <section id="tab-speedtest" class="tabpanel" role="tabpanel">
    <div class="controls">
      <button class="btn" id="stStartBtn" type="button" data-running="0">Start Test</button>
      <span id="stStage" class="pill info">
        <span class="dot"></span><span id="stStageText">Idle</span>
      </span>
      <div class="field">
        <label for="stServerSelect">Server</label>
        <select id="stServerSelect" class="mono"></select>
      </div>
    </div>
    <p id="stError" class="error-text" hidden></p>
    <div class="speed-readout">
      <div class="speed-metric">
        <div class="speed-metric-label">Download <span class="speed-metric-status dl-color" id="liveDownStatus"></span></div>
        <div class="speed-metric-value dl-color mono" id="liveDownVal">—</div>
      </div>
      <div class="speed-metric">
        <div class="speed-metric-label">Upload <span class="speed-metric-status ul-color" id="liveUpStatus"></span></div>
        <div class="speed-metric-value ul-color mono" id="liveUpVal">—</div>
      </div>
    </div>
    <canvas id="spark"></canvas>
    <div class="stats-grid">
      <div class="stat"><div class="label">Ping</div><div class="value" id="statPing">—</div></div>
      <div class="stat"><div class="label">Jitter</div><div class="value" id="statJitter">—</div></div>
      <div class="stat"><div class="label">Packet loss</div><div class="value" id="statLoss">—</div></div>
      <div class="stat"><div class="label">Download</div><div class="value" id="statDown">—</div></div>
      <div class="stat"><div class="label">Upload</div><div class="value" id="statUp">—</div></div>
    </div>
  </section>

</main>
<div class="log-panel-wrap">
  <div class="card">
    <div class="log-panel-head">
      <span>Activity Log</span>
      <div class="log-panel-actions">
        <button class="btn secondary" id="logExportBtn" type="button">Export CSV</button>
        <button class="btn danger secondary" id="logClearBtn" type="button">Clear</button>
      </div>
    </div>
    <div id="logBody" class="log-panel-body mono"></div>
  </div>
</div>

<footer class="site-footer">Developed by <a href="https://myevent-labs.io" target="_blank" rel="noopener noreferrer">MyEvent Labs</a></footer>


<script>
(function(){
  'use strict';

  var qs = new URLSearchParams(location.search);
  var token = qs.get('token') || '';
  var wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var wsUrl = wsProto + location.host + '/ws?token=' + encodeURIComponent(token);

  var $ = function(sel, root){ return (root || document).querySelector(sel); };
  var $all = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  // ---------- theme (light/dark/system) ----------
  var THEME_KEY = 'netdx-theme';
  var themeToggle = $('#themeToggle');
  var themeGlyphEl = themeToggle.querySelector('.theme-glyph');
  var themeLabelEl = themeToggle.querySelector('.theme-label');

  function getStoredThemePref(){
    var v = null;
    try{ v = localStorage.getItem(THEME_KEY); }catch(e){}
    return (v === 'light' || v === 'dark') ? v : 'system';
  }
  function systemPrefersDark(){
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function effectiveTheme(pref){
    return (pref === 'light' || pref === 'dark') ? pref : (systemPrefersDark() ? 'dark' : 'light');
  }
  function updateThemeButton(pref){
    var eff = effectiveTheme(pref);
    var glyph = eff === 'dark' ? '\u263E' : '\u2600';
    var label = eff === 'dark' ? 'Dark' : 'Light';
    if(pref === 'system') label += ' (auto)';
    if(themeGlyphEl.textContent !== glyph) themeGlyphEl.textContent = glyph;
    if(themeLabelEl.textContent !== label) themeLabelEl.textContent = label;
    var title = 'Theme: ' + (pref === 'system' ? ('System — currently ' + (eff === 'dark' ? 'Dark' : 'Light')) : (eff === 'dark' ? 'Dark' : 'Light')) + ' (click to change)';
    if(themeToggle.title !== title) themeToggle.title = title;
  }
  function applyThemePref(pref){
    if(pref === 'light' || pref === 'dark'){ document.documentElement.dataset.theme = pref; }
    else { delete document.documentElement.dataset.theme; }
    updateThemeButton(pref);
  }

  var currentThemePref = getStoredThemePref();
  updateThemeButton(currentThemePref);

  themeToggle.addEventListener('click', function(){
    currentThemePref = currentThemePref === 'system' ? 'light' : (currentThemePref === 'light' ? 'dark' : 'system');
    try{
      if(currentThemePref === 'system') localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, currentThemePref);
    }catch(e){}
    applyThemePref(currentThemePref);
  });

  if(window.matchMedia){
    var themeMq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemThemeChange = function(){ if(currentThemePref === 'system') updateThemeButton(currentThemePref); };
    if(themeMq.addEventListener) themeMq.addEventListener('change', onSystemThemeChange);
    else if(themeMq.addListener) themeMq.addListener(onSystemThemeChange);
  }

  // ---------- tab switching ----------
  var tabButtons = $all('.tab-btn');
  var tabPanels = {
    overview: $('#tab-overview'),
    traceroute: $('#tab-traceroute'),
    telnet: $('#tab-telnet'),
    speedtest: $('#tab-speedtest')
  };
  tabButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var name = btn.dataset.tab;
      tabButtons.forEach(function(b){
        var active = b === btn;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      Object.keys(tabPanels).forEach(function(k){
        tabPanels[k].classList.toggle('active', k === name);
      });
      if(name === 'speedtest'){ drawSparkline(lastSpeedtestSamples.down, lastSpeedtestSamples.up); }
    });
  });

  // ---------- websocket with reconnect/backoff ----------
  var ws = null;
  var backoff = 1000;
  var BACKOFF_MAX = 20000;
  var reconnectTimer = null;
  var deliberateClose = false;

  var statusPill = $('#statusPill');
  var statusText = $('#statusText');
  function setStatus(cls, text){
    statusPill.className = 'pill ' + cls;
    statusText.textContent = text;
  }

  function connect(){
    setStatus('info', backoff > 1000 ? 'Reconnecting…' : 'Connecting…');
    try{
      ws = new WebSocket(wsUrl);
    }catch(e){
      scheduleReconnect();
      return;
    }
    ws.onopen = function(){
      backoff = 1000;
      setStatus('ok', 'Connected');
    };
    ws.onmessage = function(evt){
      var msg;
      try{ msg = JSON.parse(evt.data); }catch(e){ return; }
      if(msg && msg.type === 'state'){ applyState(msg); }
    };
    ws.onclose = function(){
      if(deliberateClose) return;
      setStatus('bad', 'Disconnected');
      scheduleReconnect();
    };
    ws.onerror = function(){ /* onclose follows */ };
  }

  function scheduleReconnect(){
    if(reconnectTimer) return;
    var delay = backoff;
    backoff = Math.min(BACKOFF_MAX, Math.floor(backoff * 1.7));

    reconnectTimer = setTimeout(function(){

  // ---------- generic keyed list reconciliation (no full re-render / no flicker) ----------
  function reconcile(container, items, keyFn, createFn, updateFn){
    var existing = {};
    Array.prototype.forEach.call(container.children, function(node){
      existing[node.dataset.key] = node;
    });
    var seen = {};
    var prev = null;
    items.forEach(function(item){
      var key = String(keyFn(item));
      seen[key] = true;
      var node = existing[key];
      if(!node){
        node = createFn(item);
        node.dataset.key = key;
      } else {
        updateFn(node, item);
      }
      if(prev === null){
        if(container.firstChild !== node) container.insertBefore(node, container.firstChild);
      } else if(prev.nextSibling !== node){
        container.insertBefore(node, prev.nextSibling);
      }
      prev = node;
    });
    Object.keys(existing).forEach(function(key){
      if(!seen[key]) container.removeChild(existing[key]);
    });
  }

  var ESCAPE_MAP = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};

  // Non-reversible short key so raw values (e.g. Windows GUID interface
  // identifiers) never leak into the DOM via data-key attributes.
  function hashKey(str){
    str = String(str === null || str === undefined ? '' : str);
    var h = 5381;
    for(var i = 0; i < str.length; i++){
      h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    }
    return h.toString(36);
  }

  function smoothSeries(arr){
    if(!arr || arr.length < 2) return (arr || []).slice();
    var winSize = 4;
    var before = Math.floor((winSize - 1) / 2);
    var after = winSize - 1 - before;
    var out = new Array(arr.length);
    for(var i = 0; i < arr.length; i++){
      var lo = Math.max(0, i - before);
      var hi = Math.min(arr.length - 1, i + after);
      var sum = 0;
      for(var j = lo; j <= hi; j++) sum += arr[j];
      out[i] = sum / (hi - lo + 1);
    }
    return out;
  }
  function hexToRgba(hex, alpha){

    var g = parseInt(hex.substring(2, 4), 16);

  }

  function drawSparkline(down, up){
    var dpr = window.devicePixelRatio || 1;
    var cw = canvas.clientWidth || 300;
    var ch = canvas.clientHeight || 160;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    var smoothDown = smoothSeries(down);
    var smoothUp = smoothSeries(up);
    var all = smoothDown.concat(smoothUp);
    var max = all.length ? Math.max.apply(null, all) : 1;
    if(max <= 0) max = 1;
    var baseline = h - h * 0.05;

    function drawSeries(arr, color){
      if(!arr || arr.length < 2) return;
      var points = arr.map(function(v, idx){
        return [
          (idx / (arr.length - 1)) * w,
          h - (v / max) * (h * 0.85) - h * 0.05
        ];
      });
      var gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, hexToRgba(color, 0.25));
      gradient.addColorStop(1, hexToRgba(color, 0));
      ctx.beginPath();
      ctx.moveTo(points[0][0], baseline);
      points.forEach(function(p){ ctx.lineTo(p[0], p[1]); });
      ctx.lineTo(points[points.length - 1][0], baseline);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      ctx.lineWidth = Math.max(1, 2 * dpr);
      ctx.strokeStyle = color;
      ctx.lineJoin = 'round';
      points.forEach(function(p, idx){
        if(idx === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      });
      ctx.stroke();
    }
    var styles = getComputedStyle(document.documentElement);
    drawSeries(smoothDown, styles.getPropertyValue('--info').trim());
    drawSeries(smoothUp, styles.getPropertyValue('--accent3').trim());
  }

    // nothing newer, never just because the user closed the banner.
    checkUpdateBtn.classList.toggle('update-ready', available && !installing);
    checkUpdateDot.hidden = !available || checking || installing;
    var btnLabel = installing ? 'Installing…' : checking ? 'Checking…' : available ? 'Update Available' : 'Check for Updates';
    if(checkUpdateBtnText.textContent !== btnLabel) checkUpdateBtnText.textContent = btnLabel;

    var key = JSON.stringify([checking, installing, available, u.error || null, u.latest_version || null]);
    if(key === lastUpdateKey){
      if(installing) showUpdateBanner('installing', 'Installing update, restarting shortly…', false, false);
      return;
    }
    lastUpdateKey = key;
    if(uptodateFadeTimer){ clearTimeout(uptodateFadeTimer); uptodateFadeTimer = null; }

    if(installing){
      showUpdateBanner('installing', 'Installing update, restarting shortly…', false, false);
    } else if(checking){
      hideUpdateBanner();
    } else if(available){
      showUpdateBanner('available', '\u2b06 Update available: ' + u.latest_version, true, true);
    } else if(u.error){
      showUpdateBanner('error', u.error, false, true);
    } else if(u.latest_version){
      showUpdateBanner('uptodate', 'Up to date (' + u.latest_version + ')', false, false);
      uptodateFadeTimer = setTimeout(function(){ hideUpdateBanner(); uptodateFadeTimer = null; }, 4000);
    } else {
      hideUpdateBanner();
    }
  }

  // ========== dispatch ==========
  function applyState(msg){
    renderNetwork(msg.network);
    renderTraceroute(msg.traceroute);
    renderTelnet(msg.telnet);
    renderSpeedtest(msg.speedtest);
    renderLog(msg.log);
    renderUpdate(msg.update);
  }

  connect();
})();
</script>
</body>
</html>
