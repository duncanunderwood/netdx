[package]
name = "netdx"
version = "0.2.1"
edition = "2021"
description = "Fast, modern, colourblind-friendly terminal network diagnostics: traceroute, telnet, speedtest, interfaces — with a built-in remote web UI."
license = "MIT"
repository = "https://github.com/duncanunderwood/netdx"

[[bin]]
name = "netdx"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-stream = "0.1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal", "fs"] }
futures-util = "0.3"
parking_lot = "0.12"

# Web server (remote UI)
axum = { version = "0.8", features = ["ws"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diagnostics
surge-ping = "0.9"
netdev = { version = "0.46", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
rand = "0.8"
dns-lookup = "4"
socket2 = "0.6"

# CLI / misc
clap = { version = "4", features = ["derive"] }
anyhow = "1"
humansize = "2"
qrcode = { version = "0.14", default-features = false }
unicode-width = "0.2.0"

# Self-update
self_replace = { package = "self-replace", version = "1.5" }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_IO"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
flate2 = "1"
tar = "0.4"
