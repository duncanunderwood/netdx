name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linux_arm: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linux_arm: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross_linux_arm: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross_linux_arm: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross_linux_arm: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross_linux_arm: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler (Linux)
        if: matrix.cross_linux_arm
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cargo for aarch64 cross-compile (Linux)
        if: matrix.cross_linux_arm
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="netdx-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/netdx" "$staging/netdx"
          chmod +x "$staging/netdx"
          tar -czf "${staging}.tar.gz" -C "$staging" netdx
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "netdx-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/netdx.exe" "$staging/netdx.exe"
          Compress-Archive -Path "$staging/netdx.exe" -DestinationPath "$staging.zip" -Force
          echo "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
